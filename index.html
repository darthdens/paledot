  <meta name="twitter:description" content="Analyze any website's SEO in seconds. Get actionable insights on meta tags, headings, images, links and more. Free SEO checker tool by Dens.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Echo AI Chat Widget -->
    <div
      id="echo-chat-container"
      style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; font-family: system-ui, -apple-system, sans-serif;"
    >
      <!-- Chat iframe using actual Echo Assistant -->
      <iframe
        id="echo-chat-iframe"
        src="https://echoai.so/e/dens?theme=dark"
        style="
            display: none;
            width: 480px;
            height: 640px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            opacity: 0;
            transform: translateY(100%);
            transition: all 0.3s ease-in-out;
            background: transparent;
            overflow: hidden;
        "
        loading="lazy"
        allow="microphone"
        title="Echo - Echo AI Assistant"
      ></iframe>

      <!-- Toggle Button -->
      <button
        id="echo-chat-toggle"
        style="
        width: 52px;
        height: 52px;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 0;
        overflow: hidden;
        position: relative;
        outline: none;
        border: none;
    "
      >
        <img
          src="https://auth.echoai.so/storage/v1/object/public/avatars/26282444-3ea5-4cb9-abda-ac58b5d606cc/1765767655747.JPG"
          alt="Dens"
          style="width: 100%; height: 100%; object-fit: cover; border-radius: inherit;"
        />
      </button>

      <style>
        /* Base button styles - light theme default */
        #echo-chat-toggle {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(16px) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.3) !important;
        }
        /* Light theme - no special styling needed for logo since it's purple */

        #echo-chat-toggle:hover {
            transform: scale(1.05) !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
        }

        /* Dark theme styles */
        #echo-chat-toggle.echo-chat-toggle-dark {
            background: rgba(30, 35, 42, 0.95) !important;
            backdrop-filter: blur(16px) !important;
            border: 1px solid rgba(71, 85, 105, 0.4) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(71, 85, 105, 0.3) !important;
        }
        /* Dark theme - no special styling needed for logo since it's purple */

        #echo-chat-toggle.echo-chat-toggle-dark #echo-logo-light-theme {
            display: none !important;
        }
        #echo-chat-toggle.echo-chat-toggle-dark #echo-logo-dark-theme {
            display: block !important;
        }
        #echo-chat-toggle.echo-chat-toggle-dark:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(71, 85, 105, 0.4) !important;
        }

        /* Mobile responsive styles */
        @media (max-width: 768px) {
            #echo-chat-iframe {
                width: 100vw !important;
                height: 100vh !important;
                border-radius: 0 !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                position: fixed !important;
            }
        }
      </style>
    </div>

    <script>
      (function() {
          const chatToggle = document.getElementById('echo-chat-toggle');
          const chatIframe = document.getElementById('echo-chat-iframe');

          let isOpen = false;
          let currentTheme = null;

          // Detect current language
          function detectLanguage() {
              const lng = localStorage.getItem('i18nextLng');
              return lng ? lng.split('-')[0] : (navigator.language || 'en').split('-')[0];
          }

          // Update iframe src with current language
          function updateIframeSrc() {
              const currentLang = detectLanguage();
              const currentSrc = chatIframe.getAttribute('src') || '';
              const baseUrl = currentSrc.split('?')[0];
              const sessionId = localStorage.getItem('echo_chat_session_id') || '';
              chatIframe.setAttribute('src', baseUrl + '?theme=dark&sessionId=' + sessionId + '&lng=' + currentLang);
          }

          // Detect host site theme - simple logic based on .dark class
          function detectHostTheme() {
              // Check if dark class is present on html element
              if (document.documentElement.classList.contains('dark')) {
                  return 'dark';
              }

              // No dark class = light mode
              return 'light';
          }

          // Update widget button styling based on host site theme (iframe always stays dark)
          function updateButtonTheme() {
              const theme = detectHostTheme();
              console.log('Detected theme:', theme);

              // Only update if theme actually changed
              if (theme === currentTheme) {
                  console.log('Theme unchanged, skipping update');
                  return;
              }

              currentTheme = theme;
              console.log('Theme changed to:', theme);

              // Apply theme to widget button ONLY - iframe always stays dark
              if (theme === 'dark') {
                  console.log('Applying dark theme to toggle');
                  chatToggle.classList.add('echo-chat-toggle-dark');
              } else {
                  console.log('Applying light theme to toggle');
                  chatToggle.classList.remove('echo-chat-toggle-dark');
              }
          }

          // Initial setup
          updateButtonTheme();
          updateIframeSrc();

          // Listen for language change events
          window.addEventListener('languageChanged', updateIframeSrc);

          // Watch for theme changes on the host site
          const observer = new MutationObserver(() => {
              updateButtonTheme();
          });

          observer.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ['class', 'data-theme', 'style']
          });

          observer.observe(document.body, {
              attributes: true,
              attributeFilter: ['class', 'data-theme', 'style']
          });

          // Listen for system theme changes
          if (window.matchMedia) {
              window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateButtonTheme);
          }

          // Toggle chat
          chatToggle.addEventListener('click', () => {
              if (!isOpen) {
                  chatToggle.style.display = 'none';
                  chatIframe.style.display = 'block';
                  setTimeout(() => {
                      chatIframe.style.opacity = '1';
                      chatIframe.style.transform = 'translateY(0)';
                  }, 10);
                  isOpen = true;
              }
          });


          // Close chat when clicking outside
          document.addEventListener('click', (e) => {
              if (isOpen && !chatIframe.contains(e.target) && !chatToggle.contains(e.target)) {
                  chatIframe.style.opacity = '0';
                  chatIframe.style.transform = 'translateY(100%)';
                  setTimeout(() => {
                      chatIframe.style.display = 'none';
                      chatToggle.style.display = 'flex';
                      isOpen = false;
                  }, 300);
              }
          });

          // Handle iframe messages for closing
          window.addEventListener('message', (event) => {
              if (event.data.type === 'ECHO_CLOSE_CHAT') {
                  chatIframe.style.opacity = '0';
                  chatIframe.style.transform = 'translateY(100%)';
                  setTimeout(() => {
                      chatIframe.style.display = 'none';
                      chatToggle.style.display = 'flex';
                      isOpen = false;
                  }, 300);
              }
          });
      })();
    </script>
    <!-- End Echo AI Chat Widget -->
  </body>
</html>
